{% extends "base.html" %}

{% block title %}Analytics — lingua·ആലയം{% endblock title %}

{% block content %}
<style>
  .analytics-wrap { max-width: 900px; margin: 0 auto; padding: 1rem; }
  .analytics-controls { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .analytics-controls select {
    padding: 0.4rem 0.6rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-family: inherit;
    background: var(--surface);
  }
  .stat-row { display: flex; gap: 1rem; margin-bottom: 1.25rem; }
  .stat-tile {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    text-align: center;
  }
  .stat-tile .value { font-size: 1.6rem; font-weight: 700; }
  .stat-tile .label { font-size: 0.75rem; color: var(--text-muted); }
  .analytics-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .analytics-card h2 { font-size: 0.9rem; margin-bottom: 0.6rem; }
  table.analytics-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.analytics-table th, table.analytics-table td {
    text-align: left;
    padding: 0.35rem 0.5rem;
    border-bottom: 1px solid var(--border);
  }
  table.analytics-table th { color: var(--text-muted); font-weight: 500; }
  .bot-tag { color: #b45309; font-size: 0.7rem; font-weight: 600; }
  .ua-cell {
    max-width: 420px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: monospace;
    font-size: 0.78rem;
  }
</style>

<div class="analytics-wrap">
  <div class="analytics-controls">
    <label for="window-select">Window:</label>
    <select
      id="window-select"
      hx-get="/admin/analytics/partial"
      hx-target="#analytics-body"
      hx-trigger="change, every 15s"
      hx-include="#window-select"
      name="window_minutes"
    >
      <option value="15">Last 15 min</option>
      <option value="60" selected>Last hour</option>
      <option value="360">Last 6 hours</option>
      <option value="1440">Last 24 hours</option>
      <option value="10080">Last 7 days</option>
    </select>
  </div>

  <div
    id="analytics-body"
    hx-get="/admin/analytics/partial?window_minutes=60"
    hx-trigger="load"
  ></div>
</div>
{% endblock content %}
